File: config/main_cross_category.yaml
random_seed: 2026
__set_seed_torch:      !!python/object/apply:torch.manual_seed          [!ref <random_seed>]
__set_seed_torch_cuda: !!python/object/apply:torch.cuda.manual_seed_all [!ref <random_seed>]
__set_seed_numpy:      !!python/object/apply:numpy.random.seed          [!ref <random_seed>]
__set_seed_random:     !!python/object/apply:random.seed                [!ref <random_seed>]

model_name: emotion2vec
probe_name: AvgTProbe
experiment_tag: run1
# task_id is the category-cross task YAML stem (paper IDs are "c<train>_c<test>",
# e.g. "c2_c3"). compose_yaml_text rewrites this per-job; the placeholder
# below is only used for ad-hoc HyperPyYAML loads of this main.
task_id: c2_c3

ratio: [80, 20]
cross_eval: false
cross_eval_category: true

data_folder: ./data/
#slurm_tmpdir: !apply:os.getenv ["SLURM_TMPDIR", "/tmp/"]
slurm_tmpdir: ./embeddings_avg_finalv2/

#----------------------------------
# Most of the knobs you should change
data_params: !include:cross_tasks/c2_c3.yaml  # category c2 → c3 — placeholder default; runtime overrides via --task

encoder_params: !include:encoders/emotion2vec.yaml

num_layers: !ref <encoder_params[num_layers]>
num_labels: !ref <data_params[num_labels]>

probe_params: !include:probes/Probe.yaml
  feature_dim: !ref <encoder_params[feature_dim]>
  num_labels: !ref <num_labels>
  num_layers: !ref <num_layers>
  layer_dim: !ref <encoder_params[layer_dim]>

hpopt_params: !include:hpopt.yaml
  hp_search_seed: !ref <random_seed>
training_params: !include:training.yaml
#----------------------------------
task: !ref <data_params[task]>
dataset: !ref <data_params[dataset]>
task_type: !ref <data_params[task_type]>

# Category prep uses these maps directly.
dataset_audio_roots:
  aphasia: !ref <data_folder>/aphasia/processed/audio
  avfad: !ref <data_folder>/avfad/processed/audio
  c9s: !ref <data_folder>/c9s/processed/audio
  coswara: !ref <data_folder>/coswara/processed/audio
  dbank: !ref <data_folder>/dbank/processed/audio
  edaic: !ref <data_folder>/edaic/processed/audio
  iemocap: !ref <data_folder>/iemocap/processed/audio
  ksof: !ref <data_folder>/ksof/processed/audio
  mvdr: !ref <data_folder>/mvdr/processed/audio
  ravdess: !ref <data_folder>/ravdess/processed/audio
  torgo: !ref <data_folder>/torgo/processed/audio
  uaspeech: !ref <data_folder>/uaspeech/processed/audio

dataset_metadata_paths:
  aphasia: !ref <data_folder>/aphasia/processed/aphasia.csv
  avfad: !ref <data_folder>/avfad/processed/avfad.csv
  c9s: !ref <data_folder>/c9s/processed/c9s.csv
  coswara: !ref <data_folder>/coswara/processed/coswara.csv
  dbank: !ref <data_folder>/dbank/processed/dbank.csv
  edaic: !ref <data_folder>/edaic/processed/edaic.csv
  iemocap: !ref <data_folder>/iemocap/processed/iemocap.csv
  ksof: !ref <data_folder>/ksof/processed/ksof.csv
  mvdr: !ref <data_folder>/mvdr/processed/mvdr.csv
  ravdess: !ref <data_folder>/ravdess/processed/ravdess.csv
  torgo: !ref <data_folder>/torgo/processed/torgo.csv
  uaspeech: !ref <data_folder>/uaspeech/processed/uaspeech.csv

rir_folder: !ref <data_folder>/rir/
noise_folder: !ref <data_folder>/noise/

cache_encoder: true
warm_cache: false
cache_pool: mean

# Cache roots for category-cross dataio:
# <root>/<dataset>/<encoder>/<split>/<cache_mode>/cache.hdf5
train_cache_dir_1: !ref <slurm_tmpdir>
val_cache_dir_1: !ref <slurm_tmpdir>

data_io_script: !ref <data_params[data_io_script]>
prepare_data_fn: !ref <data_params[prepare_data_fn]>
label_key: !ref <data_params[label_key]>

output_folder: !ref ./exps/cross_cat/<task_id>/<model_name>-<probe_name>-<experiment_tag>/
save_folder: !ref <output_folder>/save
train_log_dir: !ref <output_folder>/

train_annotation: !ref ./exps/cross_cat/<task_id>/manifest/train.json
val_annotation: !ref ./exps/cross_cat/<task_id>/manifest/valid.json
test_annotation: !ref ./exps/cross_cat/<task_id>/manifest/test.json

skip_prep: !ref <data_params[skip_prep]>

encoder: !ref <encoder_params[encoder]>
model: !new:model.probe.Model
  encoder: !ref <encoder>
  probe: !ref <probe_params[probe]>

modules:
  model: !ref <model>

max_length: !ref <encoder_params[max_length]>
min_length: !ref <encoder_params[min_length]>

test_only: !ref <training_params[test_only]>
precision: !ref <training_params[precision]>
eval_precision: !ref <training_params[eval_precision]>
number_of_epochs: !ref <training_params[number_of_epochs]>
batch_size: !ref <training_params[batch_size]>
lr_s: !ref <training_params[lr_s]>
lr_e: !ref <lr_s> / 10
sample_rate: !ref <encoder_params[sample_rate]>
l2: !ref <training_params[l2]>

skip_nonfinite_grads: !ref <training_params[skip_nonfinite_grads]>
nonfinite_patience: !ref <training_params[nonfinite_patience]>

num_workers: !ref <training_params[num_workers]>
persistent_workers: !ref <training_params[persistent_workers]>

train_dataloader_options:
  batch_size: !ref <batch_size>
  drop_last: False
  num_workers: !ref <num_workers>
  persistent_workers: !ref <persistent_workers>
  shuffle: True

val_dataloader_options:
  batch_size: !ref <batch_size>
  drop_last: False
  persistent_workers: !ref <persistent_workers>
  num_workers: !ref <num_workers>

test_dataloader_options:
  batch_size: !ref <batch_size>
  drop_last: False
  persistent_workers: False
  num_workers: 0

train_logger: !new:speechbrain.utils.train_logger.TensorboardLogger
  save_dir: !ref <train_log_dir>

progressbar: !ref <training_params[progressbar]>

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounterWithStopper
  limit: !ref <number_of_epochs>
  limit_to_stop: !ref <hpopt_params[grace_period]>
  limit_warmup: !ref <hpopt_params[limit_warmup]>
  direction: !ref <hpopt_params[optim_mode]>

opt_class: !name:torch.optim.AdamW
  lr: !ref <lr_s>
  weight_decay: !ref <l2>

loss: !ref <data_params[loss]>

# Auto-compute pos_weight / class weight from the training manifest at brain
# init. Overrides any pos_weight set in the task YAML. Skipped for regression.
auto_class_weights: true

# HP Optimizer
# Enable Ray Tune hyperparameter optimization
continue_exp: !ref <hpopt_params[continue_exp]>
optim_metric: !ref <hpopt_params[optim_metric]>
optim_mode: !ref <hpopt_params[optim_mode]>
max_concurrent_trials: !ref <hpopt_params[max_concurrent_trials]>
grace_period: !ref <hpopt_params[grace_period]>
limit_warmup: !ref <hpopt_params[limit_warmup]>
hp_search_seed: !ref <hpopt_params[hp_search_seed]>
ray_tune_config: !ref <hpopt_params[ray_tune_config]>
hpopt_config: !ref <hpopt_params[hpopt_config]>

lr_annealing: !new:speechbrain.nnet.schedulers.LinearScheduler
  initial_value: !ref <lr_s>
  final_value: !ref <lr_e>
  epoch_count: !ref <number_of_epochs>

ckpt_interval_minutes: 15
checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
  checkpoints_dir: !ref <save_folder>
  recoverables:
    probe: !ref <probe_params[probe]>
    counter: !ref <epoch_counter>
