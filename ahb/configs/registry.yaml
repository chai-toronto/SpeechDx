# Single source of truth for orchestrator task/encoder enumeration.
# Edit this file (and the matching YAML in encoders/ or tasks/) when adding a
# new encoder or task — not the run_all*.py scripts.

# model_name -> encoder yaml filename. The model_name is what appears in
# experiment folder names and is what --encoder flags accept.
encoders:
  qwen3voice:   qwen3_voice.yaml
  wavlm:        wavlm.yaml
  ast:          ast.yaml
  audiomae:     audiomae.yaml
  clap:         clap.yaml         # 48 kHz; serialize via -j 1
  emotion2vec:  emotion2vec.yaml
  hubert:       hubert.yaml
  mms:          mms.yaml
  opera_gt:     opera_gt.yaml
  w2v2:         w2v2.yaml
  wavjepa:      wavjepa.yaml
  whisper:      whisper.yaml

# Tasks listed on the paper "Task Characteristics" sheet. Used by both the
# full benchmark (run_all.py) and the data-efficiency sweep
# (run_all_data_eff.py).
paper_tasks:
  - edaic_depC
  - edaic_phqR
  - ravdess_emoC
  - ravdess_emoBC
  - iemocap_emoC
  - iemocap_emoBC
  - dbank_adC
  - dbank_mmseR
  - aphasia_pwaC
  - torgo_dysC
  - torgo_sevR
  - uaspeech_dysC
  - mvdr_parkC
  - mvdr_updrs5R
  - mvdr_updrs18R
  - mvdr_hyR
  - ksof_intC
  - ksof_stutL
  - c9s_t1
  - c9s_L_t1
  - c9s_t2
  - c9s_L_t2
  - c9s_sympL
  - coswara_sympC
  - coswara_covidC
  - coswara_sympL
  - avfad_pathC

# Sub-sample levels for run_all_data_eff.py.
# `name` is a path component (no '.'); `fraction` is the train participant fraction.
data_eff_levels:
  - {name: "06p25", fraction: 0.0625}
  - {name: "12p5",  fraction: 0.125}
  - {name: "25",    fraction: 0.25}
  - {name: "50",    fraction: 0.50}

# Default encoders for run_all_data_eff.py when --encoder is not passed.
# Set to null to default to all encoders. Edit when iterating on a subset.
data_eff_default_encoders:
  - qwen3voice
  - wavlm
  - ast
  - whisper

# Cross-task pairs for run_all_cross.py. Currently driven by --task flags;
# leave empty unless pinning a default set.
cross_pairs: []

# Datasets to skip across all modes.
exclude_datasets:
  - daic_woz

# Per-dataset access metadata used by `ahb prep` to auto-download or yell.
# `access` is informational; `contact` is shown to the user if raw/ is empty
# and no scripts/download_<name>.sh exists. `metadata_script` overrides the
# default convention `metadata_script/create_<name>_metadata.py`.
datasets:
  ravdess:    {access: open}                                                                  # scripts/download_ravdess.sh
  coswara:    {access: open}                                                                  # scripts/download_coswara.sh
  mvdr:       {access: open}                                                                  # scripts/download_mvdr.sh (CC BY 4.0)
  torgo:      {access: open}                                                                  # scripts/download_torgo.sh
  ksof:       {access: eula,         contact: "https://th-nuernberg.github.io/kassel-state-of-fluency/"}
  uaspeech:   {access: email,        contact: "uaspeech-requests@lists.illinois.edu"}
  iemocap:    {access: form,         contact: "https://sail.usc.edu/iemocap/"}
  dbank:      {access: dta,          contact: "madress2023@ed.ac.uk (https://luzs.gitlab.io/madress-2023/)"}
  aphasia:    {access: registration, contact: "https://aphasia.talkbank.org/"}
  edaic:      {access: dta,          contact: "https://dcapswoz.ict.usc.edu/"}
  c9s:        {access: dta,          contact: "covid-19-sounds@cl.cam.ac.uk (https://covid-19-sounds.org/)"}
  avfad:      {access: email,        contact: "ieeta-acsa@ua.pt (https://acsa.web.ua.pt/AVFAD.htm)"}
