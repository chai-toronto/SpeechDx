# Single source of truth for orchestrator task/encoder enumeration.
# Edit this file (and the matching YAML in encoders/ or tasks/) when adding a
# new encoder or task — not the run_all*.py scripts.

# model_name -> encoder yaml filename. The model_name is what appears in
# experiment folder names and is what --encoder flags accept.
encoders:
  qwen3voice:   qwen3_voice.yaml
  wavlm:        wavlm.yaml
  ast:          ast.yaml
  audiomae:     audiomae.yaml
  clap:         clap.yaml         # 48 kHz; serialize via -j 1
  emotion2vec:  emotion2vec.yaml
  hubert:       hubert.yaml
  mms:          mms.yaml
  opera_gt:     opera_gt.yaml
  w2v2:         w2v2.yaml
  wavjepa:      wavjepa.yaml
  whisper:      whisper.yaml

# Tasks listed on the paper "Task Characteristics" sheet. Used by both the
# full benchmark (run_all.py) and the data-efficiency sweep
# (run_all_data_eff.py).
#
# Each stem is also the YAML filename under ahb/configs/tasks/ and also the
# experiment folder name under exps/single_task/. The IDs match the paper's
# T1..T27, so paper tasks land at exps/single_task/T9/... etc. (was
# exps/single_task/aphasia_pwaC/... before the rename); auxiliary single
# tasks whose stem is already <dataset>_<task> keep their old folder name,
# and encoder caches (keyed only by <dataset>) are unaffected either way.
paper_tasks:
  - T1   # edaic_depC      — EDAIC-WOZ  Depression / healthy            (C)
  - T2   # edaic_phqR      — EDAIC-WOZ  PHQ-8 score                     (R)
  - T3   # ravdess_emoC    — RAVDESS    Emotion classification          (C)
  - T4   # ravdess_emoBC   — RAVDESS    Negative / non-negative emotion (C)
  - T5   # iemocap_emoC    — IEMOCAP    Emotion classification          (C)
  - T6   # iemocap_emoBC   — IEMOCAP    Negative / non-negative emotion (C)
  - T7   # dbank_adC       — DementiaBank Dementia / healthy            (C)
  - T8   # dbank_mmseR     — DementiaBank MMSE score                    (R)
  - T9   # aphasia_pwaC    — AphasiaBank Aphasia / healthy              (C)
  - T10  # torgo_dysC      — TORGO      Dysarthria / healthy            (C)
  - T11  # torgo_sevR      — TORGO      Dysarthria severity             (R)
  - T12  # uaspeech_dysC   — UASpeech   Dysarthria / healthy            (C)
  - T13  # mvdr_parkC      — MDVR-KCL   Parkinson's / healthy           (C)
  - T14  # mvdr_updrs5R    — MDVR-KCL   UPDRS-5 score                   (R)
  - T15  # mvdr_updrs18R   — MDVR-KCL   UPDRS-18 score                  (R)
  - T16  # mvdr_hyR        — MDVR-KCL   H&Y score                       (R)
  - T17  # ksof_intC       — KSoF-C     Disfluency / healthy            (C)
  - T18  # ksof_stutL      — KSoF-C     Disfluency classification       (M)
  - T19  # c9s_t1          — COVID-19 Sounds  Symptomatic / healthy (official subset)   (C)
  - T20  # c9s_L_t1        — COVID-19 Sounds  Symptomatic / healthy                     (C)
  - T21  # c9s_t2          — COVID-19 Sounds  COVID-19 / non-COVID-19 (official subset) (C)
  - T22  # c9s_L_t2        — COVID-19 Sounds  COVID-19 / non-COVID-19                   (C)
  - T23  # c9s_sympL       — COVID-19 Sounds  Symptom classification                    (M)
  - T24  # coswara_sympC   — Coswara    Symptomatic / healthy           (C)
  - T25  # coswara_covidC  — Coswara    COVID-19 / non-COVID-19         (C)
  - T26  # coswara_sympL   — Coswara    Symptom classification          (M)
  - T27  # avfad_pathC     — AVFAD      Vocal pathology / healthy       (C)

# Sub-sample levels for run_all_data_eff.py.
# `name` is a path component (no '.'); `fraction` is the train participant fraction.
data_eff_levels:
  - {name: "06p25", fraction: 0.0625}
  - {name: "12p5",  fraction: 0.125}
  - {name: "25",    fraction: 0.25}
  - {name: "50",    fraction: 0.50}

# Default encoders for run_all_data_eff.py when --encoder is not passed.
# Set to null to default to all encoders. Edit when iterating on a subset.
data_eff_default_encoders:
  - qwen3voice
  - wavlm
  - ast
  - whisper

# Cross-task pairs (train on dataset A, test on dataset B). Each entry must
# have a matching yaml at ahb/configs/cross_tasks/<stem>.yaml. Stems use the
# paper IDs of the underlying single tasks: ``Tx_Ty`` where Tx names the
# train task and Ty names the test task. Folder name on disk is also the
# stem (exps/cross/T9_T7/...). Used by `ahb cross run` / status / summary.
# To add a new pair: drop the yaml in cross_tasks/ and append the stem here.
cross_pairs:
  - T9_T7    # aphasia_dbank_pwaC_adC       — aphasia/pwaC   → dbank/adC
  - T27_T19  # avfad_c9s_pathC_t1           — avfad/pathC    → c9s/t1
  - T27_T21  # avfad_c9s_pathC_t2           — avfad/pathC    → c9s/t2
  - T27_T25  # avfad_coswara_pathC_covidC   — avfad/pathC    → coswara/covidC
  - T27_T24  # avfad_coswara_pathC_sympC    — avfad/pathC    → coswara/sympC
  - T19_T27  # c9s_avfad_t1_pathC           — c9s/t1         → avfad/pathC
  - T21_T27  # c9s_avfad_t2_pathC           — c9s/t2         → avfad/pathC
  - T19_T24  # c9s_coswara_t1_sympC         — c9s/t1         → coswara/sympC
  - T21_T25  # c9s_coswara_t2_covidC        — c9s/t2         → coswara/covidC
  - T25_T27  # coswara_avfad_covidC_pathC   — coswara/covidC → avfad/pathC
  - T24_T27  # coswara_avfad_sympC_pathC    — coswara/sympC  → avfad/pathC
  - T25_T21  # coswara_c9s_covidC_t2        — coswara/covidC → c9s/t2
  - T24_T19  # coswara_c9s_sympC_t1         — coswara/sympC  → c9s/t1
  - T7_T9    # dbank_aphasia_adC_pwaC       — dbank/adC      → aphasia/pwaC
  - T1_T6    # edaic_iemocap_depC_emoBC     — edaic/depC     → iemocap/emoBC
  - T1_T4    # edaic_ravdess_depC_emoBC     — edaic/depC     → ravdess/emoBC
  - T6_T1    # iemocap_edaic_emoBC_depC     — iemocap/emoBC  → edaic/depC
  - T6_T4    # iemocap_ravdess_emoBC_emoBC  — iemocap/emoBC  → ravdess/emoBC
  - T17_T13  # ksof_mvdr_intC_parkC         — ksof/intC      → mvdr/parkC
  - T17_T10  # ksof_torgo_intC_dysC         — ksof/intC      → torgo/dysC
  - T17_T12  # ksof_uaspeech_intC_dysC      — ksof/intC      → uaspeech/dysC
  - T13_T17  # mvdr_ksof_parkC_intC         — mvdr/parkC     → ksof/intC
  - T13_T10  # mvdr_torgo_parkC_dysC        — mvdr/parkC     → torgo/dysC
  - T13_T12  # mvdr_uaspeech_parkC_dysC     — mvdr/parkC     → uaspeech/dysC
  - T4_T1    # ravdess_edaic_emoBC_depC     — ravdess/emoBC  → edaic/depC
  - T4_T6    # ravdess_iemocap_emoBC_emoBC  — ravdess/emoBC  → iemocap/emoBC
  - T10_T17  # torgo_ksof_dysC_intC         — torgo/dysC     → ksof/intC
  - T10_T13  # torgo_mvdr_dysC_parkC        — torgo/dysC     → mvdr/parkC
  - T10_T12  # torgo_uaspeech_dysC          — torgo/dysC     → uaspeech/dysC
  - T12_T17  # uaspeech_ksof_dysC_intC      — uaspeech/dysC  → ksof/intC
  - T12_T13  # uaspeech_mvdr_dysC_parkC     — uaspeech/dysC  → mvdr/parkC
  - T12_T10  # uaspeech_torgo_dysC          — uaspeech/dysC  → torgo/dysC

# Cross-category tasks (multi-source train on category A → test on category B).
# Each entry must have a matching yaml at
# ahb/configs/cross_tasks/<stem>.yaml using the plural train_datasets /
# test_datasets schema. Stems are ``cN_cM`` (was ``category_cN_cM``); folder
# name on disk is also the stem (exps/cross_cat/c2_c3/...). Used by
# `ahb cross-cat run` / status / summary.
cross_categories:
  - c1_c2    # category_c1_c2  — c1 train → c2 test
  - c1_c3    # category_c1_c3  — c1 train → c3 test
  - c1_c4    # category_c1_c4  — c1 train → c4 test
  - c2_c1    # category_c2_c1  — c2 train → c1 test
  - c2_c3    # category_c2_c3  — c2 train → c3 test
  - c2_c4    # category_c2_c4  — c2 train → c4 test
  - c3_c1    # category_c3_c1  — c3 train → c1 test
  - c3_c2    # category_c3_c2  — c3 train → c2 test
  - c3_c4    # category_c3_c4  — c3 train → c4 test
  - c4_c1    # category_c4_c1  — c4 train → c1 test
  - c4_c2    # category_c4_c2  — c4 train → c2 test
  - c4_c3    # category_c4_c3  — c4 train → c3 test

# Datasets to skip across all modes.
exclude_datasets:
  - daic_woz

# Per-dataset access metadata used by `ahb prep` to auto-download or yell.
# `access` is informational; `contact` is shown to the user if raw/ is empty
# and no scripts/download_<name>.sh exists. `metadata_script` overrides the
# default convention `metadata_script/create_<name>_metadata.py`.
datasets:
  ravdess:    {access: open}                                                                  # scripts/download_ravdess.sh
  coswara:    {access: open}                                                                  # scripts/download_coswara.sh
  mvdr:       {access: open}                                                                  # scripts/download_mvdr.sh (CC BY 4.0)
  torgo:      {access: open}                                                                  # scripts/download_torgo.sh
  ksof:       {access: eula,         contact: "https://th-nuernberg.github.io/kassel-state-of-fluency/"}
  uaspeech:   {access: email,        contact: "uaspeech-requests@lists.illinois.edu"}
  iemocap:    {access: form,         contact: "https://sail.usc.edu/iemocap/"}
  dbank:      {access: dta,          contact: "madress2023@ed.ac.uk (https://luzs.gitlab.io/madress-2023/)"}
  aphasia:    {access: registration, contact: "https://aphasia.talkbank.org/"}
  edaic:      {access: dta,          contact: "https://dcapswoz.ict.usc.edu/"}
  c9s:        {access: dta,          contact: "covid-19-sounds@cl.cam.ac.uk (https://covid-19-sounds.org/)"}
  avfad:      {access: email,        contact: "ieeta-acsa@ua.pt (https://acsa.web.ua.pt/AVFAD.htm)"}
