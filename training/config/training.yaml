num_workers: 0 # 22 Change when on HPC, this is for DataLoader
batch_size: 4
persistent_workers: False
progressbar: True
test_only: False
precision: fp32
eval_precision: bf16
skip_nonfinite_grads: True
nonfinite_patience: 10
grad_accumulation_factor: 1
# Ray will override these during and after hyperparameter optimization
number_of_epochs: 50
lr_s: 1e-4
