# AudioMAE (Audio Masked Autoencoder)
# Source: https://arxiv.org/abs/2207.06405
# Internally clips to 10 seconds; uses mel-spectrogram preprocessing

sample_rate: 16000
feature_dim: 768
num_layers: 12
layer_dim: 1
max_length: 10
min_length: 3

encoder: !new:model.audiomae.AudioMAE
  ssl_encoder_source: "hance-ai/audiomae"
  freeze_encoder: True
  output_hidden_states: False
