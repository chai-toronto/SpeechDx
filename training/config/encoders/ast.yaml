# AST (Audio Spectrogram Transformer)
# Source: https://arxiv.org/abs/2104.01778
# Trained on 10-second AudioSet clips; internally pads/truncates to 10s

sample_rate: 16000
feature_dim: 768
num_layers: 12
layer_dim: 1
max_length: 10
min_length: 3

encoder: !new:model.ast.AST
  ssl_encoder_source: "MIT/ast-finetuned-audioset-10-10-0.4593"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
  max_length: 1024  # spectrogram frames (~10s with 10ms hop)
