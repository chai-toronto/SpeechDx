# HP Optimizer
# Enable Ray Tune hyperparameter optimization
continue_exp: False   # False = wipe and restart HP search; True = resume previous run (orchestrator already skips finished jobs)
optim_metric: 'loss'
optim_mode: 'min'  # 'min' or 'max' depending on the metric
max_concurrent_trials: 1  # Number of concurrent trials to run
grace_period: 5  # max number of epochs without improvement
limit_warmup: 2  # 4: Number of epochs to ignore for ONLY early stopping


# Ray Tune specific configuration
ray_tune_config:
  num_samples: 5  # Number of trial runs
  resources_per_trial:
    cpu: 2   # CPUs per trial
    # ⚠ gpu: 0 used to hide the GPU from the trial actor entirely.
    # Ray 2.54 announced via FutureWarning: "Ray will no longer override
    # accelerator visible devices env var if num_gpus=0 or num_gpus=None
    # ... set RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO=0". In our smoke run
    # (41294939) the actor saw an empty CUDA_VISIBLE_DEVICES,
    # torch.cuda.is_available()=False, and the brain landed on CPU —
    # nvidia-smi showed 47 MiB used on the 40 GiB MIG and the actor was
    # 99% on a single CPU core, ~60 s/batch for a 7M-param probe. Set
    # gpu: 1 so Ray claims the full slice (we only run 1 concurrent
    # trial per actor anyway, so this matches reality).
    gpu: 1

# Define hyperparameter search space
# This is optional - if not provided, defaults will be used
hpopt_config:
  lr_s:
    type: "!tune.loguniform"
    values: [1e-4, 1e-3]

  l2:
    type: "!tune.loguniform"
    values: [0.01, 0.1]

#  l2_ratio:
#    type: "!tune.uniform"
#    values: [0.01, 0.5]