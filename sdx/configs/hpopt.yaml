# HP Optimizer
# Enable Ray Tune hyperparameter optimization
continue_exp: False   # False = wipe and restart HP search; True = resume previous run (orchestrator already skips finished jobs)
optim_metric: 'loss'
optim_mode: 'min'  # 'min' or 'max' depending on the metric
max_concurrent_trials: 1  # Number of concurrent trials to run
grace_period: 5  # max number of epochs without improvement
limit_warmup: 2  # 4: Number of epochs to ignore for ONLY early stopping


# Ray Tune specific configuration
ray_tune_config:
  num_samples: 5  # Number of trial runs
  resources_per_trial:
    cpu: 2   # CPUs per trial
    # gpu: 0 lets Ray schedule on hosts where no GPU is visible (CPU
    # partition) — required for the CPU-saturation experiments.
    #
    # Historical context: ``gpu: 0`` used to silently route a GPU trial
    # to CPU because Ray 2.54 hid CUDA from the actor by default
    # (FutureWarning, smoke run 41294939: actor saw empty
    # CUDA_VISIBLE_DEVICES, torch.cuda.is_available()=False, ~60 s/batch
    # on one CPU core). GPU sbatches MUST now export
    # ``RAY_ACCEL_ENV_VAR_OVERRIDE_ON_ZERO=0`` so Ray keeps the original
    # CUDA_VISIBLE_DEVICES in place and the brain stays on the slice.
    gpu: 0

# Define hyperparameter search space
# This is optional - if not provided, defaults will be used
hpopt_config:
  lr_s:
    type: "!tune.loguniform"
    values: [1e-4, 1e-3]

  l2:
    type: "!tune.loguniform"
    values: [0.01, 0.1]

#  l2_ratio:
#    type: "!tune.uniform"
#    values: [0.01, 0.5]