

sample_rate: 16000
feature_dim: 1024
num_layers: 24
layer_dim: 1
max_length: 10e5
min_length: 1

# Chunks batched per encoder forward() in the warm path. Exact via
# Wav2Vec2.feature_lengths (conv-stride map) so batched output is
# bit-identical to per-chunk serial; OOM-safe halving shrinks it on long
# chunks. 1 = serial. Perf-only knob (see benchmark-integrity notes).
warm_batch_size: 16

encoder: !new:model.w2v2.Wav2Vec2
  ssl_encoder_source: "facebook/wav2vec2-large-960h-lv60-self"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>