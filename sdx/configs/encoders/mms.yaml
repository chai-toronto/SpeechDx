
sample_rate: 16000
feature_dim: 1280  # 1280 for mms-1b
num_layers: 48     # 48 for mms-1b
layer_dim: 1
max_length: 10e5
min_length: 1

# Chunks batched per encoder forward() in the warm path. Exact via
# MMS.feature_lengths (conv-stride map) so batched output is bit-identical
# to per-chunk serial; OOM-safe halving shrinks it. mms-1b is the heaviest
# (48 layers, 1280-d) so start smaller than the others. 1 = serial.
warm_batch_size: 8

encoder: !new:model.mms.MMS
  ssl_encoder_source: "facebook/mms-1b"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
