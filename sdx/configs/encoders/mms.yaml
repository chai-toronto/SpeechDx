# MMS (Massively Multilingual Speech)
# Source: https://arxiv.org/abs/2305.13516
# Wav2Vec2-based model trained on 1,400+ languages
#
# Available models:
# - facebook/mms-300m: 1024 dim, 24 layers
# - facebook/mms-1b:   1280 dim, 48 layers

sample_rate: 16000
feature_dim: 1280  # 1280 for mms-1b
num_layers: 48     # 48 for mms-1b
layer_dim: 1
max_length: 10e5
min_length: 1

encoder: !new:model.mms.MMS
  ssl_encoder_source: "facebook/mms-1b"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
