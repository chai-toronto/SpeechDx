
sample_rate: 16000
feature_dim: 1280  # 384 tiny, 512 base, 768 small, 1024 medium, 1280 large
num_layers: 32     # 4 tiny, 6 base, 12 small, 24 medium, 32 large
layer_dim: 1
max_length: 30
min_length: 30

# Chunks batched per encoder forward() during warm. min_length==max_length (30s) -> uniform chunks; batched==serial to 4.8e-5 relative on raw frames.
# Validated batched==serial on real audio before enabling (re-check: tests/test_batched_warm.py).
# Perf-only knob; OOM-safe halving shrinks it if a batch is too big.
warm_batch_size: 16

encoder: !new:model.whisper.Whisper
  ssl_encoder_source: "openai/whisper-large-v3"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
