
sample_rate: 16000
feature_dim: 768
num_layers: 12
layer_dim: 1
max_length: 10
min_length: 10

# Chunks batched per encoder forward() during warm. min_length==max_length (10s) -> uniform chunks, no padding: batching is EXACT (max|diff|=0).
# Validated batched==serial on real audio before enabling (re-check: tests/test_batched_warm.py).
# Perf-only knob; OOM-safe halving shrinks it if a batch is too big.
warm_batch_size: 32

encoder: !new:model.audiomae.AudioMAE
  ssl_encoder_source: "hance-ai/audiomae"
  freeze_encoder: True
  output_hidden_states: False
