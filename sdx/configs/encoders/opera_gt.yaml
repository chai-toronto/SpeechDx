
sample_rate: 16000
feature_dim: 384
num_layers: 1  # single CLS token output
layer_dim: 1
max_length: 8.18
min_length: 8.18

# Chunks batched per encoder forward() during warm. min_length==max_length (8.18s) -> uniform chunks, no padding: batching is EXACT (max|diff|=0).
# Validated batched==serial before enabling (scripts/compare_warm_batched.py pattern).
# Perf-only knob; OOM-safe halving shrinks it if a batch is too big.
warm_batch_size: 32

encoder: !new:model.opera.OPERA_GT
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
