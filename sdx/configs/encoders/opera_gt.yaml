# OPERA-GT (OPEn Respiratory Acoustic - MAE ViT Small)
# 8.18 seconds → 256×64 spectrogram → 384-dim output

sample_rate: 16000
feature_dim: 384
num_layers: 1  # single CLS token output
layer_dim: 1
max_length: 8.18
min_length: 8.18

encoder: !new:model.opera.OPERA_GT
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
