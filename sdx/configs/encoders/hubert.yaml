
sample_rate: 16000
feature_dim: 1024  # 1024 for large, 768 for base
num_layers: 24     # 24 for large, 12 for base
layer_dim: 1
max_length: 10e5
min_length: 1

# Chunks batched per encoder forward() in the warm path. Exact via
# HuBERT.feature_lengths (wav2vec2 conv-stride map) so batched output is
# bit-identical to per-chunk serial; OOM-safe halving shrinks it on long
# chunks. 1 = serial. Perf-only knob (see benchmark-integrity notes).
warm_batch_size: 16

encoder: !new:model.hubert.HuBERT
  ssl_encoder_source: "facebook/hubert-large-ls960-ft"
  freeze_encoder: True
  output_hidden_states: False
  sample_rate: !ref <sample_rate>
