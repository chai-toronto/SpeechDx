# Reader-only training reads embeddings from a multi_L<N> HDF5 cache
# rsynced to $SLURM_TMPDIR by train_wavrx.sbatch. Each sample is a tuple
# of L per-layer ndarrays — for mdvr's longest uid (~9k frames, 12
# layers, 768 dim, fp16) that's ~130 MB pre-collation. Once a worker
# collates B=16 of these into 12 padded tensors and queues them via
# shared memory, peak in-flight per batch is 5–10 GB; multiplied by
# (num_workers × prefetch_factor) it OOM-killed the Tune actor even at
# --mem=320G. Setting num_workers=0 makes I/O synchronous in the main
# process and bounds the working set to one batch.
num_workers: 0
batch_size: 16
persistent_workers: False
progressbar: True
test_only: False
precision: fp16
eval_precision: fp16
skip_nonfinite_grads: True
nonfinite_patience: 10
grad_accumulation_factor: 1
number_of_epochs: 50
# Ray will override these during and after hyperparameter optimization
lr_s: 1e-4
l2: 0.01