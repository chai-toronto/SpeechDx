task: c1_c4
task_type: B

dataset: cross_tasks
train_datasets: ["edaic", "ravdess", "iemocap"]
test_datasets: ["c19sounds", "coswara", "avfad"]

data_io_script: training.dataio.prep_category_c1_c4
prepare_data_fn: prepare_category_c1_c4

label_key: label_encoded
skip_prep: False
num_labels: 1
loss: !new:torch.nn.BCEWithLogitsLoss

setting_1:  # train_datasets[0] = 'edaic' (aug params from T1.yaml)
  split_by_boundary: true
  num_aug_ver: 3
  snr_low: 0
  snr_high: 15
  speed: !new:builtins.list
    - !new:builtins.range
      - 90
      - 110
      - 1
setting_2:  # train_datasets[1] = 'ravdess' (aug params from T3.yaml)
  split_by_boundary: false
  num_aug_ver: 3
  snr_low: 0
  snr_high: 15
  speed: !new:builtins.list
    - !new:builtins.range
      - 90
      - 110
      - 1
setting_3:  # train_datasets[2] = 'iemocap' (aug params from T5.yaml)
  split_by_boundary: false
  num_aug_ver: 3
  snr_low: 0
  snr_high: 15
  speed: !new:builtins.list
    - !new:builtins.range
      - 90
      - 110
      - 1

test_setting_1: {split_by_boundary: false}
test_setting_2: {split_by_boundary: false}
test_setting_3: {split_by_boundary: false}
