task: T16
task_type: R

dataset: mdvr

# ----------------------------------
# DYNAMIC SCRIPT CONFIGURATION (Generic)
# ----------------------------------
# Path to the file containing the dataset-specific preparation and IO functions
data_io_script: training.dataio.prep_mdvr

# Name of the function to call for manifest generation
prepare_data_fn: prepare_data

# Key used in the SpeechBrain batch object for the label
label_key: label_encoded
raw_label_key: hy_rating

# Data preparation
skip_prep: False

# Cross Validation
num_fold: 5 # works from 2 to num. subjects. To be implemented: 0 -> normal split no CV, -1 -> LOSO

num_labels: 1

loss: !new:torch.nn.MSELoss

##### Augmentation
# For all data that can be trained, during training with cached repr, will sample from versions
num_aug_ver: 5
snr_low: 0
snr_high: 15
speed: !new:builtins.list
  - !new:builtins.range
    - 90 #start
    - 110 #stop
    - 1 #step
