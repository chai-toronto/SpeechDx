task: T8
task_type: R

dataset: dementiabank

data_io_script: training.dataio.prep_dementiabank
prepare_data_fn: prepare_dementiabank_mmseR

label_key: label_encoded
skip_prep: False

num_labels: 1

# Bin edges for auto per-sample regression weighting (np.digitize semantics):
# bins are 0-9 / 10-18 / 19-23 / 24-30.
clinical_cutoffs: [10, 19, 24]

loss: !new:torch.nn.MSELoss

split_by_boundary: false

optim_metric: loss
optim_mode: min

num_aug_ver: 3
snr_low: 0
snr_high: 15
speed: !new:builtins.list
  - !new:builtins.range
    - 90 #start
    - 110 #stop
    - 1 #step