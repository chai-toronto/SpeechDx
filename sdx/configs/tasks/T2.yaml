task: T2
task_type: R

dataset: edaic

data_io_script: training.dataio.prep_edaic
prepare_data_fn: prepare_edaic_phqR

label_key: label_encoded
skip_prep: False

num_labels: 1

# Bin edges for auto per-sample regression weighting (np.digitize semantics):
# bins are 0-4 / 5-9 / 10-14 / 15-19 / 20+ (PHQ-8 severity).
clinical_cutoffs: [5, 10, 15, 20]

loss: !new:torch.nn.MSELoss

split_by_boundary: true

optim_metric: loss
optim_mode: min

num_aug_ver: 3
snr_low: 0
snr_high: 15
speed: !new:builtins.list
  - !new:builtins.range
    - 90 #start
    - 110 #stop
    - 1 #step
