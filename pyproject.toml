[project]
name = "speechdx"
version = "0.1.0"
description = "Reproducible benchmark for self-supervised audio encoders on health-related speech tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Scientific stack
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "h5py>=3.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tqdm>=4.65",
    "pyyaml>=6.0",
    # Audio + torch
    "librosa>=0.10",
    "soundfile>=0.12",
    "torch>=2.0",
    "torchaudio>=2.0",
    "torchvision>=0.26.0",
    # Encoder loaders / pretrained weights
    "transformers>=4.40",
    "huggingface-hub>=0.20",
    # SpeechBrain pipeline + hyperparam yaml
    "speechbrain @ git+https://github.com/speechbrain/speechbrain.git@develop",
    "hyperpyyaml>=1.2",
    # speechbrain's train_logger eagerly imports torch.utils.tensorboard
    "tensorboard>=2.15",
    # Hyperparameter search
    "ray[tune]>=2.40",
    "optuna>=3.5",
    # Required by the OPERA-GT encoder loader (third_party/OPERA)
    "pytorch-lightning>=2.0",
    "timm>=1.0",
    "efficientnet-pytorch>=0.7",
    "torchlibrosa>=0.1",
    # Required by the emotion2vec and qwen3voice encoders
    "funasr>=1.3",
    "qwen-tts>=0.1",
    # Notebook kernel for ad-hoc analysis
    "ipykernel>=7.0",
    "qwen-omni-utils>=0.0.9",
    "google-genai>=2.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdx*", "model*"]

[tool.setuptools.package-data]
sdx = ["configs/**/*.yaml"]
